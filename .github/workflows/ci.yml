name: ci

# Unit tests and lint only. The engine itself needs your own copy of Balatro, so engine
# validation (scripts/validate_engine.py, scripts/compare_jackdaw.py) runs locally, not here.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run pytest -q
