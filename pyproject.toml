[project]
name = "balatro-bot"
version = "0.1.0"
description = "Exact headless Balatro engine, real-game harness and differential testing tools for Balatro bots"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.0",
]

[project.optional-dependencies]
# jackdaw: fast Rust simulator (MIT), pinned to the release validated against the exact engine.
# Only on platforms with a release wheel: a package with the same name on PyPI is unrelated.
sim = ["jackdaw==0.2.6 ; (sys_platform == 'darwin' and (platform_machine == 'arm64' or platform_machine == 'x86_64')) or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or sys_platform == 'win32'"]

[tool.uv]
package = false

[tool.uv.sources]
# Prebuilt release wheels (no Rust toolchain needed); uv.lock pins their hashes.
jackdaw = [
    { url = "https://github.com/TylerFlar/jackdaw-balatro/releases/download/v0.2.6/jackdaw-0.2.6-cp312-abi3-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
    { url = "https://github.com/TylerFlar/jackdaw-balatro/releases/download/v0.2.6/jackdaw-0.2.6-cp312-abi3-macosx_10_12_x86_64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'x86_64'" },
    { url = "https://github.com/TylerFlar/jackdaw-balatro/releases/download/v0.2.6/jackdaw-0.2.6-cp312-abi3-manylinux_2_28_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { url = "https://github.com/TylerFlar/jackdaw-balatro/releases/download/v0.2.6/jackdaw-0.2.6-cp312-abi3-manylinux_2_28_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { url = "https://github.com/TylerFlar/jackdaw-balatro/releases/download/v0.2.6/jackdaw-0.2.6-cp312-abi3-win_amd64.whl", marker = "sys_platform == 'win32'" },
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["vendor", "runtime", "backups"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
